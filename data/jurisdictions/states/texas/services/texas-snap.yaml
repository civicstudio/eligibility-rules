id: texas-snap
name: Texas SNAP
alternate_names:
  - Texas Food Stamps
  - Lone Star Card
jurisdiction_id: texas
agency_id: hhsc
service_type: benefit
category: food-assistance
description: |
  Texas SNAP provides monthly food benefits to eligible low-income
  households via the Lone Star Card (EBT). Texas does not use
  Broad-Based Categorical Eligibility, so federal gross and net
  income limits and asset tests apply.
application_url: https://www.yourtexasbenefits.com/
source_urls:
  - https://www.hhs.texas.gov/services/food/snap-food-benefits
  - https://www.fns.usda.gov/snap/recipient/eligibility
last_verified: 2026-03-16

ruleset:
  service_id: texas-snap
  effective_date: 2024-10-01
  rules:
    - id: income-gross
      key: household_income_fpl
      operator: less_than_or_equal
      value: 130
      unit: percent
      requirement: required
      label: Gross Income
      description: |
        Gross monthly income must be at or below 130% of the
        Federal Poverty Level for your household size. Texas does
        not use Broad-Based Categorical Eligibility.
      source_url: https://www.hhs.texas.gov/services/food/snap-food-benefits/snap-eligibility

    - id: income-net
      key: household_net_income_fpl
      operator: less_than_or_equal
      value: 100
      unit: percent
      requirement: required
      label: Net Income
      description: |
        Net monthly income (after deductions) must be at or below
        100% of the Federal Poverty Level.
      source_url: https://www.hhs.texas.gov/services/food/snap-food-benefits/snap-eligibility

    - id: assets
      key: countable_assets
      operator: less_than_or_equal
      value: 2750
      unit: dollars
      requirement: required
      label: Asset Limit
      description: |
        Countable resources must be $2,750 or less, or $4,250 if
        the household includes an elderly or disabled member.
      source_url: https://www.fns.usda.gov/snap/recipient/eligibility

    - id: residency
      key: state_residency
      operator: equals
      value: TX
      requirement: required
      label: Texas Residency
      description: Must be a Texas resident.

    - id: citizenship
      key: citizenship_status
      operator: in
      values:
        - us_citizen
        - us_national
        - qualified_alien
      requirement: required
      label: Citizenship/Immigration
      description: |
        Must be a U.S. citizen, U.S. national, or qualified
        immigrant. Qualified immigrants must generally have 5 years
        of residency (exceptions for refugees, asylees, veterans).
      source_url: https://www.fns.usda.gov/snap/eligibility/citizen/non-citizen-policy

    - id: work-requirements
      key: age
      operator: between
      min: 18
      max: 49
      requirement: required
      label: ABAWD Work Requirements
      description: |
        Able-bodied adults without dependents (ABAWDs) aged 18-49
        must work or participate in a work program at least 80
        hours per month. Limited to 3 months of benefits in a
        36-month period without meeting work requirements.
      source_url: https://www.hhs.texas.gov/services/food/snap-food-benefits/snap-eligibility
      any_of:
        - id: exempt-disabled
          key: has_disability
          operator: equals
          value: true
          description: Has a disability
        - id: exempt-dependent
          key: has_dependent_child
          operator: equals
          value: true
          description: Cares for a dependent child
        - id: exempt-pregnant
          key: is_pregnant
          operator: equals
          value: true
          description: Is pregnant
