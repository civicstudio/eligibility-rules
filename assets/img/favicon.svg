<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Rectangle base (rules) -->
  <rect x="10" y="30" width="80" height="40" fill="black"/>
  <!-- Binding line -->
  <line x1="50" y1="30" x2="50" y2="70" stroke="white" stroke-width="2"/>
  <!-- Open flare on right -->
  <polygon points="90,30 100,25 100,75 90,70" fill="black"/>
  <!-- Checkmark overlay (eligibility stamp) -->
  <path d="M30 50 L40 60 L60 40" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>